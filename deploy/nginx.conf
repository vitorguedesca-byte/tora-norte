# nginx do site: montado em /etc/nginx/conf.d/default.conf pelo EasyPanel
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;

    # a página sempre confere se há versão nova (responde 304 quando não mudou)
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # CSS e JS vêm com ?v=<hash> no index.html: mudou o arquivo, muda o endereço
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:webp|jpe?g|png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
    }
}
